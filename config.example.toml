# gcp-authcalator configuration
#
# Pass this file with: gcp-authcalator <command> --config config.toml
# CLI flags take precedence over values in this file.

# GCP project ID (required for `gate` and `metadata-proxy`).
# For `with-prod` this is the *default* target project; pass `--project <id>`
# to target a different project per invocation (e.g. when the gate fronts a
# folder full of projects via a folder-scoped PAM entitlement). The
# `--project` value flows through to the metadata proxy and the wrapped
# child's `CLOUDSDK_CORE_PROJECT`.
project_id = "my-gcp-project"

# Service account email to impersonate for dev tokens (required for `gate`)
service_account = "dev-runner@my-gcp-project.iam.gserviceaccount.com"

# Path to the Unix domain socket shared between host and container.
# Default: $XDG_RUNTIME_DIR/gcp-authcalator.sock
# (or ~/.gcp-authcalator/gcp-authcalator.sock if XDG_RUNTIME_DIR is unset)
#
# The socket is created mode 0660, group-owned by the gate UID's primary
# group. The containing directory is set to 0750 — except when it is
# $XDG_RUNTIME_DIR itself, which the gate leaves at the system-managed 0700
# per the XDG spec. To grant a different-UID agent (e.g. a `the-robot` user
# in a dev container) access to the main socket, place socket_path in a
# directory the gate manages (e.g. ~/.gcp-authcalator/) and add the agent
# user to the gate UID's primary group.
# socket_path = "/run/user/1000/gcp-authcalator.sock"

# Path to the admin socket for approve/deny commands (not mounted into containers)
# Default: $XDG_RUNTIME_DIR/gcp-authcalator-admin/admin.sock
# (or ~/.gcp-authcalator/gcp-authcalator-admin/admin.sock if XDG_RUNTIME_DIR is unset)
# admin_socket_path = "/run/user/1000/gcp-authcalator-admin/admin.sock"

# TCP port for the metadata proxy
# Default: 8173
# port = 8173

# OAuth scopes for token requests
# Default: ["https://www.googleapis.com/auth/cloud-platform"]
# scopes = ["https://www.googleapis.com/auth/cloud-platform", "https://www.googleapis.com/auth/sqlservice.login"]

# PAM (Privileged Access Manager) — just-in-time prod escalation
# When set, prod token requests trigger a PAM grant before minting the token.
#
# Four accepted forms:
#   * Short ID (e.g. "prod-db-admin") — expanded against `project_id` and
#     `pam_location` into projects/<project>/locations/<loc>/entitlements/<id>.
#   * Project-scoped full path — must match this gate's project_id.
#     "projects/my-gcp-project/locations/global/entitlements/prod-db-admin"
#   * Folder-scoped full path — passed through verbatim. One folder grant
#     covers every project beneath the folder, which is the multi-project
#     setup: configure one entitlement here, then use `with-prod --project=...`
#     per invocation. `project_id` is not consulted for folder paths.
#     "folders/123456789/locations/global/entitlements/prod-db-admin"
#   * Organization-scoped full path — same shape as folder, one level up.
#     Covers every project in the org.
#     "organizations/987654321/locations/global/entitlements/prod-db-admin"
# pam_policy = "prod-db-admin"

# Additional PAM entitlements that callers may request via query param.
# The default pam_policy is always allowed; these are extras.
# Each entry follows the same four-form rule as pam_policy.
# pam_allowed_policies = ["prod-readonly", "prod-migration"]

# PAM entitlement location for short-form IDs (default: global).
# Folder/project full-path forms carry their own location and ignore this.
# pam_location = "global"

# Token lifetime in seconds (default: 3600 / 1 hour)
# Keep this low to limit exfiltration risk. Tokens auto-refresh within sessions.
# token_ttl_seconds = 3600

# PAM grant lifetime in seconds (default: token_ttl_seconds, range: 60–43200).
# Configure independently of token_ttl_seconds when PAM/IAM propagation latency
# makes per-rotation pauses visible to callers: a longer grant means one cached
# grant serves many short-lived tokens before the gate calls PAM again. Minted
# prod tokens are still clamped to (grant_expiry - 5 min drain margin), so this
# does not extend the lifetime of any individual token — it only changes how
# often the gate creates/rotates PAM grants.
#
# Example: 4-hour grant covering four 1-hour token refreshes:
# token_ttl_seconds = 3600
# pam_grant_ttl_seconds = 14400

# Prod session lifetime in seconds (default: 28800 / 8 hours)
# Controls how long with-prod can refresh tokens without re-confirmation.
# session_ttl_seconds = 28800

# ---------------------------------------------------------------------------
# Operator socket — auto-approve for the human operator (gate only)
# ---------------------------------------------------------------------------
#
# Adds a third Unix socket alongside the main + admin sockets. Prod requests
# arriving on this socket auto-approve (no confirmation dialog) when their
# resolved PAM policy is in auto_approve_pam_policies. Trust is a property of
# the socket: filesystem permissions decide who can connect.
#
# DEPLOYMENT MODEL: human operator and coding agent run as different UIDs in
# the same environment.
#
# Two access modes:
#   * UID mode (paved path, operator_socket_group unset): socket is mode 0600
#     owned by the gate UID. Use when the operator and gate share a UID
#     (typical local-devcontainer setup with matched UIDs for bind mounts).
#   * Group mode (operator_socket_group set): socket is mode 0660 group-
#     owned by that group. Use when multiple humans share one gate.
#
# SECURITY:
#   - The agent UID must run as a different UID than the gate. The gate
#     refuses to start if agent_uid equals the gate UID.
#   - In group mode, the agent UID MUST NOT be a member of
#     operator_socket_group, or the gate refuses to start (verified at
#     startup against /etc/group).
#   - Sessions (POST /session, GET /token?session=…) return 403 on this
#     socket — there is no 8-hour bearer credential to steal.
#   - auto_approve_pam_policies must be a subset of pam_allowed_policies
#     (or equal pam_policy). Treat additions to this list with the same
#     review rigor as IAM policy changes — anything in this list is granted
#     by *any* code that runs as the operator UID, including malicious code
#     planted via the operator's tooling.
#   - This is Unix-socket-only. Remote (TCP+mTLS) operators do not get
#     auto-approve; they take the standard prompt path.
#
# Single-operator (paved path):
# operator_socket_path = "/run/user/1000/gcp-authcalator-operator.sock"
# auto_approve_pam_policies = ["prod-readonly"]
#
# Multi-operator (advanced — uncomment to switch to group mode):
# operator_socket_group = "gcp-operators"
#
# agent_uid: numeric UID or username. Required when operator_socket_path is
# set so the gate can verify the agent UID is not the gate UID (and, in
# group mode, not a member of the operator group).
# agent_uid = 1001
# agent_uid = "claude"

# Extra environment variables for with-prod subprocess.
# Values support ${VAR} and ${VAR:-default} substitution resolved against the
# elevated environment (after GCE_METADATA_HOST etc. are set).
# [env]
# CPL_MACHINE_IS_GCE = "YES"
# CPL_GCE_CREDENTIALS_URL = "http://${GCE_METADATA_HOST:-127.0.0.1:8173}/computeMetadata/v1/instance/service-accounts/default/token"
